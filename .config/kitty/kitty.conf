# ~/.config/kitty/kitty.conf
# iTerm2-style keybindings for kitty's built-in multiplexer (tabs + splits).
# Reload after editing: Ctrl+Cmd+, (or `kitty @ load-config`)

# ─── Layouts ────────────────────────────────────────────────────────────────
# `splits` gives iTerm2-style vertical/horizontal panes.
enabled_layouts splits,stack

# ─── Tab bar ────────────────────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ─── Mouse / scrollback ─────────────────────────────────────────────────────
scrollback_lines        20000
mouse_hide_wait         3.0
copy_on_select          no
strip_trailing_spaces   smart

# ─── macOS niceties ─────────────────────────────────────────────────────────
macos_option_as_alt           yes
macos_quit_when_last_window_closed yes
macos_traditional_fullscreen  no

# ─── Keybindings ────────────────────────────────────────────────────────────
# Clear the default kitty_mod chord so we can layer iTerm2-style cmd bindings.
clear_all_shortcuts no

# Tabs (iTerm2: Cmd+T / Cmd+W / Cmd+] / Cmd+[ / Cmd+1..9)
map cmd+t           new_tab_with_cwd
map cmd+w           close_window
map cmd+shift+w     close_tab
map cmd+shift+]     next_tab
map cmd+shift+[     previous_tab
map cmd+right       next_tab
map cmd+left        previous_tab
map cmd+1           goto_tab 1
map cmd+2           goto_tab 2
map cmd+3           goto_tab 3
map cmd+4           goto_tab 4
map cmd+5           goto_tab 5
map cmd+6           goto_tab 6
map cmd+7           goto_tab 7
map cmd+8           goto_tab 8
map cmd+9           goto_tab 9
map cmd+shift+t     set_tab_title

# Splits (iTerm2: Cmd+D vertical, Cmd+Shift+D horizontal)
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current

# Navigate splits (iTerm2: Cmd+Opt+Arrow)
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down

# Move/swap splits
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down

# Resize splits (iTerm2: Cmd+Ctrl+Arrow)
map cmd+ctrl+left   resize_window narrower
map cmd+ctrl+right  resize_window wider
map cmd+ctrl+up     resize_window taller
map cmd+ctrl+down   resize_window shorter
map cmd+ctrl+0      resize_window reset

# Zoom current split (iTerm2: Cmd+Shift+Enter)
map cmd+shift+enter toggle_layout stack

# Windows (iTerm2: Cmd+N new window, Cmd+Enter fullscreen)
map cmd+n           new_os_window_with_cwd
map cmd+enter       toggle_fullscreen

# Font size (iTerm2: Cmd+= / Cmd+- / Cmd+0)
map cmd+equal       change_font_size all +1.0
map cmd+plus        change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# Clipboard (iTerm2: Cmd+C / Cmd+V)
map cmd+c           copy_to_clipboard
map cmd+v           paste_from_clipboard

# Scrollback search (iTerm2: Cmd+F)
map cmd+f           show_scrollback
map cmd+k           clear_terminal scrollback active
map cmd+shift+k     clear_terminal reset active

# Reload config
map cmd+comma       load_config_file
map ctrl+cmd+comma  load_config_file
